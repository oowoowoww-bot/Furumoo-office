<title>🔒 무무무빌딩 · MOO.MOO.MOO COMPANY</title>
<!-- 무무무빌딩(MOO.MOO.MOO COMPANY) · 잠금 페이지 · made by 우이 (tools/lock.mjs 로 생성)
     내용은 PBKDF2-SHA256(150000회) + AES-256-GCM 으로 암호화되어 있습니다.
     비밀번호 없이는 평문이 이 파일 안에 존재하지 않습니다. -->
<style>
  :root{
    --lilac:#7C5CFF; --lilac-deep:#5B3FD6; --lilac-soft:#EDE6FF; --lilac-line:#D9CCFF;
    --cream:#FBF3E7; --paper:#FFFDF8; --ink:#3A2E26; --ink2:#6E5C4E; --ink3:#A18B76;
    --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR","Noto Sans KR",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:var(--font);color:var(--ink);
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 18px calc(18px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 90% at 12% 0%, #F1E9FF 0%, rgba(241,233,255,0) 60%),
      radial-gradient(110% 80% at 92% 8%, #FFEFF6 0%, rgba(255,239,246,0) 55%),
      radial-gradient(120% 90% at 50% 108%, #FFF3E2 0%, rgba(255,243,226,0) 62%),
      var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  /* 은은한 픽셀 격자 — 오피스맵 분위기 */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:linear-gradient(rgba(124,92,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(124,92,255,.05) 1px,transparent 1px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(80% 70% at 50% 40%, #000 0%, transparent 78%);
            mask-image:radial-gradient(80% 70% at 50% 40%, #000 0%, transparent 78%);
    z-index:-1;
  }
  .wrap{position:relative;z-index:1;width:100%;max-width:392px;margin:auto}
  .card{
    background:linear-gradient(180deg,#FFFEFB 0%,var(--paper) 100%);
    border:1.5px solid var(--lilac-line);
    border-radius:26px;
    padding:26px 22px 20px;
    box-shadow:0 2px 0 rgba(91,63,214,.05), 0 18px 40px -12px rgba(91,63,214,.22), 0 8px 18px -10px rgba(90,64,38,.18);
    text-align:center;
    animation:rise .5s cubic-bezier(.22,1.1,.36,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .lockicon{
    width:62px;height:62px;margin:2px auto 14px;border-radius:20px;
    display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;
    background:linear-gradient(160deg,#F3ECFF 0%,#E7DCFF 100%);
    border:1.5px solid var(--lilac-line);
    box-shadow:inset 0 -3px 0 rgba(124,92,255,.10), 0 6px 14px -8px rgba(124,92,255,.5);
  }
  h1{font-size:19px;line-height:1.35;margin:0 0 6px;letter-spacing:-.02em;font-weight:800;color:#2F2430}
  .sub{margin:0 0 18px;font-size:13px;line-height:1.5;color:var(--ink2)}
  .sub .en{display:inline-block;margin-bottom:5px;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--lilac-deep)}
  .sub b{color:var(--lilac-deep);font-weight:700}
  form{margin:0}
  .field{position:relative;margin-bottom:10px}
  label.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  input#pw{
    width:100%;height:52px;padding:0 46px 0 16px;
    font-family:var(--font);font-size:17px;letter-spacing:.02em;color:var(--ink);
    background:#FFFDFA;border:1.5px solid #E8DCC6;border-radius:15px;outline:none;
    transition:border-color .16s, box-shadow .16s, background .16s;
  }
  input#pw::placeholder{color:#BCAA96;letter-spacing:0;font-size:15px}
  input#pw:focus{border-color:var(--lilac);box-shadow:0 0 0 4px rgba(124,92,255,.14);background:#fff}
  .eye{
    position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;background:transparent;
    border-radius:11px;color:var(--ink3);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .eye:active{background:#F5EFFC}
  button.go{
    width:100%;height:52px;border:0;border-radius:15px;cursor:pointer;
    font-family:var(--font);font-size:16px;font-weight:800;letter-spacing:-.01em;color:#fff;
    background:linear-gradient(180deg,#8C6EFF 0%,var(--lilac) 55%,var(--lilac-deep) 100%);
    box-shadow:0 3px 0 #4B32B8, 0 12px 22px -10px rgba(92,63,214,.75);
    transition:transform .08s, box-shadow .08s, filter .16s;
  }
  button.go:active{transform:translateY(2px);box-shadow:0 1px 0 #4B32B8, 0 6px 12px -8px rgba(92,63,214,.7)}
  button.go[disabled]{filter:saturate(.6) brightness(.98);cursor:progress}
  .msg{
    min-height:20px;margin:12px 0 0;font-size:13px;line-height:1.45;font-weight:600;
    color:#C2410C;opacity:0;transition:opacity .15s;
  }
  .msg.on{opacity:1}
  .msg.busy{color:var(--lilac-deep)}
  .hint{margin:14px 0 0;font-size:11.5px;line-height:1.5;color:var(--ink3)}
  .hint .dot{color:var(--lilac-line);margin:0 5px}
  /* 오입력 흔들림 */
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    12%{transform:translateX(-9px)} 26%{transform:translateX(8px)}
    40%{transform:translateX(-6px)} 54%{transform:translateX(5px)}
    68%{transform:translateX(-3px)} 82%{transform:translateX(2px)}
  }
  .shake{animation:shake .46s cubic-bezier(.36,.07,.19,.97) both}
  .shake input#pw{border-color:#F0A98B;box-shadow:0 0 0 4px rgba(240,140,100,.14)}
  .out{animation:out .34s ease both}
  @keyframes out{to{opacity:0;transform:translateY(-6px) scale(.99)}}
  /* 탭 세션 자동 잠금 해제 중 — 잠금 카드 대신 잠깐 보여요 */
  .opening{
    display:none;position:fixed;inset:0;z-index:2;
    flex-direction:column;align-items:center;justify-content:center;gap:12px;
    font-size:13.5px;font-weight:700;color:var(--lilac-deep);letter-spacing:-.01em;
  }
  .opening .spin{
    width:28px;height:28px;border-radius:50%;
    border:3px solid var(--lilac-soft);border-top-color:var(--lilac);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  html.session-unlock .opening{display:flex}
  html.session-unlock .card, html.session-unlock footer{visibility:hidden}
  footer{
    position:relative;z-index:1;margin-top:18px;text-align:center;
    font-size:11px;letter-spacing:.04em;color:#B7A492;
  }
  footer b{color:var(--lilac);font-weight:800;letter-spacing:0}
  @media (max-width:400px){
    body{padding:18px 14px calc(14px + env(safe-area-inset-bottom))}
    .card{border-radius:22px;padding:22px 17px 17px}
    .lockicon{width:56px;height:56px;font-size:27px;margin-bottom:12px}
    h1{font-size:17.5px}
    .sub{font-size:12.5px;margin-bottom:16px}
    input#pw,button.go{height:50px}
    input#pw{font-size:16px}
  }
  @media (min-width:640px){
    .wrap{max-width:404px}
    .card{padding:30px 28px 24px;border-radius:28px}
    h1{font-size:21px}
    .sub{font-size:13.5px}
  }
  @media (prefers-reduced-motion:reduce){
    .card{animation:none}
    .shake{animation:none}
    .opening .spin{animation:none;border-top-color:var(--lilac-soft);border-right-color:var(--lilac)}
  }
</style>
</head>

  <footer>made by <b>우이</b></footer>
</div>

<script>
(function(){
  "use strict";
  var B64 = (document.getElementById("payload").textContent || "").replace(/\s+/g, "");
  var SALT = new Uint8Array([236,180,205,91,191,23,94,32,146,128,150,75,48,250,70,117]);   // Uint8Array
  var IV   = new Uint8Array([253,188,230,89,64,223,155,214,183,63,75,177]);     // Uint8Array (12)
  var ITER = 150000;
  // 이 탭을 닫기 전까지는 비밀번호를 다시 묻지 않아요 (sessionStorage = 탭 단위, 닫으면 사라져요).
  // 비밀번호 글자 자체는 저장하지 않고, 비밀번호로 만든 AES 키만 담아 둡니다.
  var SESSION_KEY = "furumoo-office.unlock.v1";
  var card = document.getElementById("card");
  var form = document.getElementById("form");
  var pw   = document.getElementById("pw");
  var go   = document.getElementById("go");
  var msg  = document.getElementById("msg");
  var eye  = document.getElementById("eye");
  var fails = 0, busy = false;

  function b64bytes(s){
    var bin = atob(s), n = bin.length, a = new Uint8Array(n);
    for(var i=0;i<n;i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function bytesB64(u8){
    var bin = "", i;
    for (i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
    return btoa(bin);
  }
  // 탭 세션에 담아 둔 키 — 탭을 닫으면 브라우저가 지워요.
  function sessionKey(){
    try {
      var v = sessionStorage.getItem(SESSION_KEY);
      if (!v) return null;
      var raw = b64bytes(v);
      return raw.length === 32 ? raw : null;
    } catch (e) { return null; }
  }
  function rememberKey(key){
    return crypto.subtle.exportKey("raw", key).then(function(raw){
      try { sessionStorage.setItem(SESSION_KEY, bytesB64(new Uint8Array(raw))); } catch (e) {}
    }).catch(function(){ /* 저장 못 해도 화면은 열어요 */ });
  }
  function forgetKey(){ try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
  function say(t, kind){
    msg.textContent = t || "";
    msg.className = "msg" + (t ? " on" : "") + (kind === "busy" ? " busy" : "");
  }
  function shake(t){
    say(t);
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
    if (window.navigator.vibrate) { try { window.navigator.vibrate(28); } catch(e){} }
  }
  card.addEventListener("animationend", function(e){
    if (e.animationName === "shake") card.classList.remove("shake");
  });
  eye.addEventListener("click", function(){
    var show = pw.type === "password";
    pw.type = show ? "text" : "password";
    eye.textContent = show ? "🙈" : "👁";
    eye.setAttribute("aria-label", show ? "비밀번호 가리기" : "비밀번호 보기");
    pw.focus();
  });

  function derive(password){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(password.normalize("NFKC")), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: SALT, iterations: ITER, hash: "SHA-256" },
          base,
          { name: "AES-GCM", length: 256 },
          true,
          ["decrypt"]
        );
      });
  }

  // 비밀번호로 만든 키로 화면(index.html 안의 payload)과 최신 데이터(data.enc)를 함께 풀어요.
  function openWith(key){
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: IV }, key, b64bytes(B64))
      .then(function(buf){
        var html = new TextDecoder("utf-8").decode(buf);
        // 우이가 6시간마다 갱신하는 데이터(data.enc)도 같은 비밀번호로 풀어서 넘겨줘요. 실패하면 화면만 열어요.
        return fetch("data.enc?t=" + Date.now(), { cache: "no-store" })
          .then(function(r){ if (!r.ok) throw 0; return r.json(); })
          .then(function(d){ return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64bytes(d.iv) }, key, b64bytes(d.ct)); })
          .then(function(db){
            var json = new TextDecoder("utf-8").decode(db).replace(/</g, "\\u003c");
            var tag = "<script>window.FURUMOO_DATA=" + json + ";<\/script>";
            return /<head>/i.test(html) ? html.replace(/<head>/i, function(h){ return h + tag; }) : tag + html;
          })
          .catch(function(){ return html; });
      });
  }

  function showForm(){
    document.documentElement.classList.remove("session-unlock");
    card.classList.remove("out");
    busy = false; go.disabled = false; go.textContent = "들어가기";
    try { pw.focus({ preventScroll: true }); } catch (e) { pw.focus(); }
  }

  function mount(html){
    try {
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      forgetKey();
      say("여는 중 문제가 생겼어요. 새로고침 후 다시 시도해 주세요.");
      showForm();
    }
  }

  // 이 탭에서 이미 잠금을 풀었으면 비밀번호를 묻지 않고 바로 열어요. (새로고침·당겨서 새로고침 포함)
  function autoOpen(raw){
    busy = true; go.disabled = true;
    crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"])
      .then(function(key){ return openWith(key); })
      .then(function(html){ mount(html); })
      .catch(function(){
        // 탭에 담긴 키가 이 화면의 비밀번호와 맞지 않으면(비밀번호를 바꿨을 때 등) 잊고 잠금 화면으로 돌아가요.
        forgetKey();
        showForm();
      });
  }

  function unlock(){
    var value = pw.value;
    if (busy) return;
    if (!value) { shake("비밀번호를 입력해 주세요"); pw.focus(); return; }
    if (!(window.crypto && crypto.subtle)) {
      say("이 브라우저에서는 잠금을 열 수 없어요. https 주소로 다시 열어 주세요.");
      return;
    }
    busy = true; go.disabled = true; go.textContent = "여는 중…"; say("");
    setTimeout(function(){
      var KEY;
      derive(value).then(function(key){
        KEY = key;
        return openWith(key);
      }).then(function(html){
        // 이 탭을 닫을 때까지 다시 묻지 않도록 키만 담아 둬요. (비밀번호 글자는 저장하지 않아요)
        return rememberKey(KEY).then(function(){ return html; });
      }).then(function(html){
        say("열렸어요!", "busy");
        card.classList.add("out");
        setTimeout(function(){ mount(html); }, 300);
      }).catch(function(){
        forgetKey();
        fails++;
        busy = false; go.disabled = false; go.textContent = "들어가기";
        pw.select();
        var wait = fails >= 3 ? 900 : 0;
        var warn = "비밀번호가 맞지 않아요";
        if (fails >= 5) warn = "비밀번호가 계속 맞지 않아요. 우이에게 물어봐 주세요";
        if (wait) { go.disabled = true; setTimeout(function(){ go.disabled = false; }, wait); }
        shake(warn);
      });
    }, 40);
  }

  form.addEventListener("submit", function(e){ e.preventDefault(); unlock(); });
  pw.addEventListener("input", function(){ if (msg.classList.contains("on")) say(""); });

  var saved = (window.crypto && crypto.subtle) ? sessionKey() : null;
  if (saved) {
    autoOpen(saved);
  } else {
    document.documentElement.classList.remove("session-unlock");
    try { pw.focus({ preventScroll: true }); } catch(e) { pw.focus(); }
  }
})();
</script>
